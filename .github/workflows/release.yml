name: Release

on:
  push: 
    tags:
      - '*'

env:
  CARGO_TERM_COLOR: always

jobs:
  prerelease:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.prerelease.outputs.value }}
    steps:
      - name: Prerelease Check
        id: prerelease
        run: |
          if [[ ${{ github.ref_name }} =~ ^v?[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              echo value=false >> $GITHUB_OUTPUT
          else
              echo value=true >> $GITHUB_OUTPUT
          fi

  publish-release:
    permissions:
      contents: write
    strategy:
      matrix:
        job:
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: aarch64-unknown-linux-musl
          os: ubuntu-latest
          target_rustflags: '--codegen linker=aarch64-linux-gnu-gcc'
        - target: aarch64-pc-windows-msvc
          os: windows-latest
        - target: x86_64-apple-darwin
          os: macos-latest
        - target: x86_64-pc-windows-msvc
          os: windows-latest
          target_rustflags: -C target-feature=+crt-static
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
    
    runs-on: "${{ matrix.job.os }}"
    
    needs:
      - prerelease
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install AArch64 Toolchain
        if: ${{ matrix.job.target == 'aarch64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-i386

      - name: Install Musl Tools
        if: ${{ contains(matrix.job.target, '-unknown-linux-musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION=${{ github.ref_name }}
          TARGET=${{ matrix.job.target }}
          DIST=$(pwd)/dist
          EXECUTABLE=target/$TARGET/release/crtcli
          
          if [[ ${{ matrix.job.os }} == windows-latest ]]; then
            EXECUTABLE=$EXECUTABLE.exe
          fi
          
          echo "Packaging $VERSION for $TARGET..."
          
          test -f Cargo.lock || cargo generate-lockfile
  
          echo "Installing rust toolchain for $TARGET..."
          
          rustup target add $TARGET
          
          if [[ $TARGET == aarch64-unknown-linux-musl ]]; then
            export CC=aarch64-linux-gnu-gcc
          fi
          
          echo "Building..."
          
          RUSTFLAGS="--codegen target-feature=+crt-static ${{ matrix.job.target_rustflags }}" \
            cargo build --bin crtcli --target $TARGET --release
          
          mkdir "$DIST"
          
          cp -r \
            $EXECUTABLE \
            LICENSE \
            README.md \
            CHANGELOG.md \
            $DIST
          
          cd $DIST
          echo "Creating release archive..."
          case ${{ matrix.job.os }} in
            ubuntu-latest | macos-latest)
              ARCHIVE=crtcli-$VERSION-$TARGET.tar.gz
              tar czf "$ARCHIVE" *
              ;;
            windows-latest)
              ARCHIVE=crtcli-$VERSION-$TARGET.zip
              7z a "$ARCHIVE" *
              ;;
          esac

          FRAGMENT_FILE="release-fragment-$TARGET.json"
          cat > "$FRAGMENT_FILE" <<EOF
          {
            "target": "$TARGET",
            "archive_name": "$ARCHIVE"
          }
          EOF

          echo "archive=dist/$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "fragment=dist/$FRAGMENT_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Release Metadata Fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-fragment-${{ matrix.job.target }}
          path: ${{ steps.package.outputs.fragment }}
          retention-days: 1
        
      - name: Publish Release Archive
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          draft: false
          files: ${{ steps.package.outputs.archive }}
          prerelease: ${{ needs.prerelease.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release-metadata:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    needs:
      - prerelease
      - publish-release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Publish Changelog
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: CHANGELOG.md
          prerelease: ${{ needs.prerelease.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release metadata fragments
        uses: actions/download-artifact@v4
        with:
          path: release-metadata-fragments
          pattern: release-fragment-*
          merge-multiple: true

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

          TAG=${{ github.ref_name }}
          PRERELEASE=${{ needs.prerelease.outputs.value }}
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"

          jq -s \
            --arg tag "$TAG" \
            --arg base_url "$BASE_URL" \
            --argjson prerelease "$PRERELEASE" \
            '{
              schema_version: 1,
              tag: $tag,
              prerelease: $prerelease,
              assets: (
                map({
                  (.target): {
                    archive_name: .archive_name,
                    download_url: ($base_url + "/" + .archive_name)
                  }
                }) | add
              )
            }' release-metadata-fragments/release-fragment-*.json > release.json

      - name: Publish Release Metadata
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: release.json
          prerelease: ${{ needs.prerelease.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
